name: Rapatrier les photos du site fédéral

on:
  push:
    branches:
      - claude/legal-geo-gallery
    paths:
      - .github/workflows/migrate-ffe-photos.yml
      - scripts/ffe-photos.txt
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les photos listées
        run: |
          set -e
          while read -r path; do
            [ -z "$path" ] && continue
            dest="public/photos/ffe${path}"
            mkdir -p "$(dirname "$dest")"
            curl -fsSL --retry 3 "https://fortapache.ffe.com${path}" -o "$dest"
            file "$dest"
          done < scripts/ffe-photos.txt
      - name: Enregistrer les photos dans la branche
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/photos/ffe
          if git diff --cached --quiet; then echo "Rien de nouveau"; exit 0; fi
          git commit -m "chore(galerie): photos rapatriées depuis fortapache.ffe.com"
          git push
